services:
  mailpit:
    image: axllent/mailpit:v1.30

    container_name: agendabarber-mailpit

    restart: unless-stopped

    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  postgres:
    image: postgres:17

    container_name: agendabarber-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate

    image: agendabarber-migrate:local

    container_name: agendabarber-migrate

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime

    image: agendabarber-backend:local

    container_name: agendabarber-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: http://localhost:3001
      PUBLIC_APP_URL: http://localhost:3001
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: "AgendaBarber <no-reply@agendabarber.local>"

    ports:
      - "${BACKEND_PORT}:3000"

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

      mailpit:
        condition: service_started


  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:${BACKEND_PORT:-3000}"

    image: agendabarber-frontend-next:local

    container_name: agendabarber-frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend:3000

    ports:
      - "${FRONTEND_PORT:-3001}:3001"

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


volumes:
  postgres_data:
