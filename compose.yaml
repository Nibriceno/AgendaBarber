services:
  postgres:
    image: postgres:17

    container_name: agendabarber-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate

    image: agendabarber-migrate:local

    container_name: agendabarber-migrate

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime

    image: agendabarber-backend:local

    container_name: agendabarber-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: http://localhost:5173

    ports:
      - "${BACKEND_PORT}:3000"

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: agendabarber-frontend:local

    container_name: agendabarber-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


volumes:
  postgres_data: